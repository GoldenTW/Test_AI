<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gemini 小助手 Chatbot</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:#f4f6f9;
      padding: 30px;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 42px;
      letter-spacing: .5px;
    }
    .input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border: 1px solid #d7dbe3;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    .input:focus {
      border-color:#7aa7ff;
      box-shadow: 0 0 0 4px rgba(122,167,255,.18);
    }
    .btn-row {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      color: #fff;
    }
    .btn-start { background: #2ecc71; }
    .btn-clear { background: #e74c3c; }
    .output {
      margin-top: 18px;
      height: 220px;
      background: #f2f3f5;
      border-radius: 12px;
      padding: 16px;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 15px;
    }
    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }
    .loading { opacity: .7; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Gemini 小助手 Chatbot</h1>

    <input id="q" class="input" placeholder="請輸入您的問題..." />

    <div class="btn-row">
      <button id="start" class="btn-start">開始</button>
      <button id="clear" class="btn-clear">清除</button>
    </div>

    <div class="hint">提示：按 Enter 也可以送出</div>

    <div id="out" class="output">（結果會顯示在這裡）</div>
  </div>

<script>
  const q = document.getElementById("q");
  const out = document.getElementById("out");
  const startBtn = document.getElementById("start");
  const clearBtn = document.getElementById("clear");

  function setLoading(on) {
    startBtn.disabled = on;
    out.classList.toggle("loading", on);
  }

  async function askGemini() {
    const msg = q.value.trim();
    if (!msg) {
      out.textContent = "請先輸入問題 🙂";
      return;
    }

    setLoading(true);
    out.textContent = "思考中…";

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ message: msg })
      });

      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Unknown error");

      out.textContent = data.reply || "";
    } catch (err) {
      out.textContent = "發生錯誤：\n" + err.message;
    } finally {
      setLoading(false);
    }
  }

  startBtn.addEventListener("click", askGemini);
  clearBtn.addEventListener("click", () => {
    q.value = "";
    out.textContent = "（結果會顯示在這裡）";
    q.focus();
  });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") askGemini();
  });
</script>
</body>
</html>
